<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patent Claim Completeness Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7FAFC;
  --surface:#ffffff;
  --tint:#EAF4FB;
  --accent:#2E86C1;
  --accent-hover:#2573A8;
  --accent-ink:#1F6699;
  --ink:#1A2733;
  --ink-2:#51616F;
  --ink-3:#8394A3;
  --line:#E1E8EE;
  --line-2:#EEF2F5;
  --shadow:0 1px 2px rgba(16,40,64,.06),0 1px 3px rgba(16,40,64,.04);
  --ok:#1D7F4E;
  --ok-bg:#E8F5EE;
  --bad:#B42318;
  --bad-bg:#FDECEA;
  --warn-bg:#FFF8EB;
  --warn-line:#E8A33D;
  --warn-ink:#7A4B00;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1720;--surface:#141F2A;--tint:#16293A;--accent:#4A9FD8;--accent-hover:#63AFE2;--accent-ink:#86C1EA;
    --ink:#E3EAF0;--ink-2:#A3B2BF;--ink-3:#71849A;--line:#223242;--line-2:#1B2936;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --ok:#55C28A;--ok-bg:#132E23;--bad:#F08A7E;--bad-bg:#361C1D;--warn-bg:#2E2413;--warn-line:#C98A2E;--warn-ink:#F0C57A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1720;--surface:#141F2A;--tint:#16293A;--accent:#4A9FD8;--accent-hover:#63AFE2;--accent-ink:#86C1EA;
  --ink:#E3EAF0;--ink-2:#A3B2BF;--ink-3:#71849A;--line:#223242;--line-2:#1B2936;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --ok:#55C28A;--ok-bg:#132E23;--bad:#F08A7E;--bad-bg:#361C1D;--warn-bg:#2E2413;--warn-line:#C98A2E;--warn-ink:#F0C57A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Shell */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand-mark{width:22px;height:22px;border-radius:4px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.02em}
.brand-name{font-weight:600;font-size:13px;letter-spacing:-.005em}
.nav{display:flex;flex-direction:column;padding:12px 8px;gap:1px}
.nav-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:6px 10px 6px}
.nav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--ink-2);padding:7px 10px;border-radius:4px;text-align:left;font-weight:500;font-size:13px}
.nav button:hover{background:var(--line-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--tint);color:var(--accent-ink);font-weight:600}
.nav svg{width:15px;height:15px;flex:none;opacity:.85}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 16px;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px}
.side-foot b{font-weight:600;color:var(--ink-2)}

.top{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(16px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:500}
.env{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);padding:2px 7px;border-radius:3px;white-space:nowrap}

main{min-width:0;display:flex;flex-direction:column}
.page{max-width:1180px;width:100%;margin-inline:auto;padding-block:24px 32px;padding-inline:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:20px;flex:1}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-size:13px;font-weight:600;margin:0}
.sub{color:var(--ink-3);margin:3px 0 0;font-size:12.5px}
.mono{font-family:var(--mono);font-size:12px}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:4px;height:32px;padding:0 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.btn-secondary:hover{border-color:var(--ink-3)}
.btn-text{border:0;background:none;color:var(--accent-ink);font-weight:500;padding:0;font-size:12.5px}
.btn-text:hover{text-decoration:underline}
.btn-danger{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line);gap:12px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi-label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.kpi-val{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-val small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:2px}
.kpi-foot{font-size:11.5px;color:var(--ink-3)}
.kpi-val.bad{color:var(--bad)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 16px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
tr:last-child > td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover > td{background:var(--bg)}
.num{text-align:right}
.id{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.muted{color:var(--ink-3)}
.pct{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:64px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.gap i{background:var(--bad)}
.status{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;letter-spacing:.01em}
.status.ok{color:var(--ok);background:var(--ok-bg)}
.status.bad{color:var(--bad);background:var(--bad-bg)}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);padding:0 4px;border-radius:3px;margin-left:6px;vertical-align:1px}

.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty p{color:var(--ink-3);max-width:46ch;margin:0}

/* Form */
.form{padding:20px;display:flex;flex-direction:column;gap:18px}
.field label{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;font-size:12.5px;margin-bottom:6px;gap:8px}
.field label span{font-weight:400;color:var(--ink-3);font-size:11.5px}
input[type=text],input[type=search],textarea{width:100%;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;padding:7px 10px;transition:border-color .12s,box-shadow .12s}
input[type=text],input[type=search]{height:34px;max-width:520px}
input:hover,textarea:hover{border-color:var(--ink-3)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.75;min-height:300px;resize:vertical;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ta-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 6px 6px}
.err{color:var(--bad);font-size:12.5px}

/* Result */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--warn-line);border-left-width:3px;border-radius:4px;background:var(--warn-bg);color:var(--warn-ink);font-weight:500}
.alert.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.alert svg{flex:none;margin-top:1px}
.summary{display:grid;grid-template-columns:minmax(220px,1.2fr) repeat(3,1fr)}
.summary > div{padding:16px 18px}
.summary > div + div{border-left:1px solid var(--line)}
.score-val{font-size:34px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.score-val.bad{color:var(--bad)}.score-val.ok{color:var(--ok)}
.score-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.score-bar i{display:block;height:100%}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.list-head{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-bottom:1px solid var(--line)}
.list-head .dot{width:8px;height:8px;border-radius:2px;flex:none}
.list-head .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cmp{max-height:380px;overflow-y:auto}
.cmp td{padding:7px 16px;font-family:var(--mono);font-size:12.5px}
.cmp td.ix{width:44px;color:var(--ink-3);font-size:11px;text-align:right;padding-right:0}
.cmp.flagged td:not(.ix){color:var(--bad);font-weight:500}
.cmp.flagged tr > td{background:color-mix(in srgb,var(--bad-bg) 55%,transparent)}
.none{padding:18px 16px;color:var(--ink-3);font-size:12.5px}
.aside{padding:12px 16px;font-size:12.5px;color:var(--ink-2)}
.aside .chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.aside code{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:3px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Library */
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:30px;height:32px}
.chev{transition:transform .15s;color:var(--ink-3);vertical-align:middle}
tr.open .chev{transform:rotate(90deg)}
tr.open > td{background:var(--bg)}
tr.detail > td{padding:0;background:var(--bg);white-space:normal}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line-2)}
.detail-col{padding:14px 16px 16px 46px}
.detail-col + .detail-col{border-left:1px solid var(--line-2);padding-left:16px}
.detail-col h3{font-size:11px;font-weight:600;color:var(--ink-3);margin:0 0 8px}
.detail-col ol{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;gap:3px}
.detail-col li.flag{color:var(--bad);font-weight:500}
.detail-col li.flag::after{content:"  not claimed";font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--bad)}
.detail-foot{display:flex;justify-content:space-between;gap:12px;padding:10px 16px 12px 46px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3);flex-wrap:wrap}

.disclaimer{margin-top:auto;padding-top:16px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:4px;font-weight:500;font-size:12.5px;box-shadow:0 4px 12px rgba(0,0,0,.18);transform:translate(-50%,8px);opacity:0;transition:.18s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:1000px){.kpis,.summary{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3),.summary>div:nth-child(3){border-left:0}.kpi:nth-child(n+3),.summary>div:nth-child(n+3){border-top:1px solid var(--line)}.detail-grid{grid-template-columns:1fr}.detail-col,.detail-col+.detail-col{padding-left:16px;border-left:0}.detail-foot{padding-left:16px}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{border-bottom:0;padding-right:4px}
  .brand-name,.side-foot,.nav-label{display:none}
  .nav{flex-direction:row;padding:8px}
  .nav button{white-space:nowrap}
  .top{top:0}
  .two,.lists{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (max-width:460px){.kpis,.summary{grid-template-columns:1fr}.kpi+.kpi,.summary>div+div{border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark" aria-hidden="true">CC</div><div class="brand-name">Claim Completeness</div></div>
    <nav class="nav" aria-label="Main">
      <div class="nav-label">Reviews</div>
      <button data-nav="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
      <button data-nav="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New Review</button>
      <button data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Review Library</button>
    </nav>
    <div class="side-foot"><b>Demo workspace</b><span>Local storage only</span></div>
  </aside>
  <main>
    <header class="top"><div class="crumbs" id="crumbs"></div><span class="env">Demo data</span></header>
    <div id="main" style="display:flex;flex-direction:column;flex:1"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const KEY = 'pccc.reviews.v2';
const DISCLAIMER = 'This tool works with compound names you provide directly — no connection to real patent filings or proprietary data.';

const SEED = [
  { id:'seed-1', name:'DX-2031 — Heterocyclic Kinase Inhibitors', demo:true,
    disclosed:['Compound-A114','Compound-A115','Compound-A118','Compound-B22','Compound-B23','Compound-C07','Compound-C09','Compound-D301'],
    claimed:['Compound-A114','Compound-A115','Compound-A118','Compound-B22','Compound-C07','Compound-C09','Compound-D301'],
    ts: Date.parse('2026-09-18T14:12:00') },
  { id:'seed-2', name:'DX-1987 — Polymer Coating Additives', demo:true,
    disclosed:['Compound-P11','Compound-P12','Compound-P14','Compound-Q3','Compound-Q5','Compound-R88'],
    claimed:['Compound-P11','Compound-P12','Compound-P14','Compound-Q3','Compound-Q5','Compound-R88'],
    ts: Date.parse('2026-09-11T09:40:00') },
  { id:'seed-3', name:'DX-1954 — Fluorinated Solvent Blends', demo:true,
    disclosed:['Compound-F201','Compound-F202','Compound-F207','Compound-G19','Compound-G20','Compound-H4','Compound-H6','Compound-J52','Compound-J53','Compound-K8'],
    claimed:['Compound-F201','Compound-F202','Compound-G19','Compound-G20','Compound-H4','Compound-J52','Compound-J53','Compound-K8'],
    ts: Date.parse('2026-08-29T16:25:00') }
];

const norm = s => s.trim().replace(/\s+/g,' ').toLowerCase();
function parseList(text){
  const seen = new Set(), out = [];
  text.split(/\r?\n/).forEach(l => { const t = l.trim().replace(/\s+/g,' '); if(!t) return; const k = t.toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push(t); });
  return out;
}
function compare(disclosed, claimed){
  const c = new Set(claimed.map(norm)), d = new Set(disclosed.map(norm));
  const matched = disclosed.filter(x => c.has(norm(x)));
  const missing = disclosed.filter(x => !c.has(norm(x)));
  const claimOnly = claimed.filter(x => !d.has(norm(x)));
  const pct = disclosed.length ? Math.round(matched.length / disclosed.length * 1000)/10 : 0;
  return { matched, missing, claimOnly, pct };
}

function load(){
  try { const raw = localStorage.getItem(KEY); if(raw){ const v = JSON.parse(raw); if(Array.isArray(v)) return v; } } catch(e){}
  return SEED.slice();
}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(reviews)); } catch(e){} }

let reviews = load();
let draft = { name:'', disclosed:'', claimed:'' };
let current = null;
let libQuery = '';
let openIds = new Set();
let view = 'dashboard';

const $main = document.getElementById('main');
const $crumbs = document.getElementById('crumbs');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtTime = ts => new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const splitName = n => { const m = n.match(/^(.*?)\s+[—–-]\s+(.*)$/); return m ? {id:m[1], title:m[2]} : {id:'—', title:n}; };
const sorted = () => reviews.slice().sort((a,b)=>b.ts-a.ts);

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200); }

const ICON = {
  warn:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  ok:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  plus:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  search:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
};
const disclaimer = () => `<p class="disclaimer">${esc(DISCLAIMER)}</p>`;
const status = n => n ? `<span class="status bad">${n} missing</span>` : `<span class="status ok">Complete</span>`;
const pctCell = c => `<span class="pct">${c.pct.toFixed(1)}%<span class="bar ${c.missing.length?'gap':''}"><i style="width:${c.pct}%"></i></span></span>`;
const demoTag = r => r.demo ? '<span class="tag">Sample</span>' : '';

const CRUMBS = {
  dashboard:['Dashboard'],
  new:['Reviews','New Review'],
  result:['Reviews','New Review','Result'],
  library:['Reviews','Review Library']
};

function go(v){
  view = v;
  if(view==='result' && !current) view = 'new';
  const navKey = view==='result' ? 'new' : view;
  document.querySelectorAll('[data-nav]').forEach(b => { if(b.dataset.nav===navKey) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const cr = CRUMBS[view];
  $crumbs.innerHTML = cr.map((c,i)=> i===cr.length-1 ? `<b>${c}</b>` : `<span>${c}</span><span aria-hidden="true">/</span>`).join('');
  render();
  window.scrollTo(0,0);
}

function render(){
  $main.innerHTML = ({dashboard:Dashboard, new:NewReview, result:Result, library:Library})[view]();
  bind();
}

/* ---------- Dashboard ---------- */
function Dashboard(){
  const total = reviews.reduce((s,r)=>s+r.disclosed.length,0);
  const flagged = reviews.reduce((s,r)=>s+compare(r.disclosed,r.claimed).missing.length,0);
  const rate = total ? ((total-flagged)/total*100).toFixed(1) : null;
  const withGaps = reviews.filter(r=>compare(r.disclosed,r.claimed).missing.length).length;
  const rows = sorted().slice(0,10).map(r=>{
    const c = compare(r.disclosed,r.claimed), n = splitName(r.name);
    return `<tr class="row" data-open="${esc(r.id)}" tabindex="0">
      <td class="id">${esc(n.id)}</td>
      <td>${esc(n.title)}${demoTag(r)}</td>
      <td class="num">${r.disclosed.length}</td>
      <td class="num">${c.missing.length || '<span class="muted">0</span>'}</td>
      <td class="num">${pctCell(c)}</td>
      <td>${status(c.missing.length)}</td>
      <td class="muted hide-sm">${esc(fmtDate(r.ts))} <span class="muted">${esc(fmtTime(r.ts))}</span></td></tr>`;
  }).join('');
  return `<div class="page">
    <div class="head">
      <div><h1>Dashboard</h1><p class="sub">Disclosure-to-claims coverage across all saved reviews</p></div>
      <button class="btn btn-primary" data-go="new">${ICON.plus}New Review</button>
    </div>
    <section class="panel kpis" aria-label="Summary">
      <div class="kpi"><span class="kpi-label">Patents Reviewed</span><span class="kpi-val">${reviews.length}</span><span class="kpi-foot">${withGaps} with open gaps</span></div>
      <div class="kpi"><span class="kpi-label">Total Compounds Checked</span><span class="kpi-val">${total}</span><span class="kpi-foot">Disclosed entries compared</span></div>
      <div class="kpi"><span class="kpi-label">Compounds Flagged Missing</span><span class="kpi-val ${flagged?'bad':''}">${flagged}</span><span class="kpi-foot">Disclosed, not in claims</span></div>
      <div class="kpi"><span class="kpi-label">Completeness Rate</span><span class="kpi-val">${rate===null?'—':rate}<small>${rate===null?'':'%'}</small></span><span class="kpi-foot">Claimed ÷ disclosed</span></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Recent reviews</h2>${reviews.length?'<button class="btn-text" data-go="library">View library</button>':''}</div>
      ${reviews.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Patent ID</th><th>Title</th><th class="num">Compounds</th><th class="num">Flagged</th><th class="num">Completeness</th><th>Status</th><th class="hide-sm">Reviewed</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
      : `<div class="empty"><h2>No reviews yet</h2><p>Compare a disclosure list against a claims section to start building review history.</p><button class="btn btn-primary" data-go="new" style="margin-top:8px">${ICON.plus}New Review</button></div>`}
    </section>
  </div>`;
}

/* ---------- New Review ---------- */
function NewReview(){
  const dc = parseList(draft.disclosed).length, cc = parseList(draft.claimed).length;
  return `<div class="page">
    <div class="head"><div><h1>New Review</h1><p class="sub">Matching is case-insensitive and ignores leading, trailing and repeated spaces.</p></div>
      <button class="btn btn-secondary" id="sample">Load sample lists</button>
    </div>
    <form class="panel" id="form" novalidate>
      <div class="form">
        <div class="field"><label for="pname">Patent name or ID</label>
          <input type="text" id="pname" placeholder="DX-2044 — Chelating Agents" value="${esc(draft.name)}" autocomplete="off"></div>
        <div class="two">
          <div class="field"><label for="disc">Disclosed compounds <span>One per line</span></label>
            <textarea id="disc" spellcheck="false" placeholder="Compound-A114&#10;Compound-A115&#10;Compound-B22">${esc(draft.disclosed)}</textarea>
            <div class="ta-meta"><span>Source: invention disclosure</span><span id="dc">${dc} unique</span></div></div>
          <div class="field"><label for="claim">Claimed compounds <span>One per line</span></label>
            <textarea id="claim" spellcheck="false" placeholder="Compound-A114&#10;Compound-B22">${esc(draft.claimed)}</textarea>
            <div class="ta-meta"><span>Source: claims section</span><span id="cc">${cc} unique</span></div></div>
        </div>
      </div>
      <div class="form-foot"><span class="err" id="err" role="alert"></span><button type="submit" class="btn btn-primary">Compare</button></div>
    </form>
    ${disclaimer()}
  </div>`;
}

/* ---------- Result ---------- */
function Result(){
  const r = current, c = compare(r.disclosed, r.claimed), n = splitName(r.name);
  const tone = c.missing.length ? 'bad' : 'ok';
  const rows = arr => `<table><tbody>${arr.map((x,i)=>`<tr><td class="ix">${i+1}</td><td>${esc(x)}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="page">
    <div class="head"><div><h1>${esc(n.title)}</h1><p class="sub"><span class="mono">${esc(n.id)}</span> · Compared ${esc(fmtDate(Date.now()))}</p></div></div>
    ${c.missing.length
      ? `<div class="alert" role="alert">${ICON.warn}<span>${c.missing.length} compound${c.missing.length>1?'s':''} disclosed but not found in claims — review before submission</span></div>`
      : `<div class="alert ok">${ICON.ok}<span>All disclosed compounds appear in the claims section.</span></div>`}
    <section class="panel summary" aria-label="Completeness summary">
      <div><span class="kpi-label">Completeness score</span>
        <div class="score-val ${tone}">${c.pct.toFixed(1)}%</div>
        <div class="score-bar"><i style="width:${c.pct}%;background:var(--${tone==='bad'?'accent':'ok'})"></i></div></div>
      <div class="kpi"><span class="kpi-label">Disclosed</span><span class="kpi-val">${r.disclosed.length}</span></div>
      <div class="kpi"><span class="kpi-label">Properly claimed</span><span class="kpi-val">${c.matched.length}</span></div>
      <div class="kpi"><span class="kpi-label">Flagged missing</span><span class="kpi-val ${c.missing.length?'bad':''}">${c.missing.length}</span></div>
    </section>
    <div class="lists">
      <section class="panel"><div class="list-head"><span class="dot" style="background:var(--ok)"></span><h2>Properly Claimed</h2><span class="n">${c.matched.length}</span></div>
        ${c.matched.length?`<div class="cmp">${rows(c.matched)}</div>`:'<div class="none">No disclosed compounds were found in the claims.</div>'}</section>
      <section class="panel"><div class="list-head"><span class="dot" style="background:var(--bad)"></span><h2>Flagged — Missing from Claims</h2><span class="n">${c.missing.length}</span></div>
        ${c.missing.length?`<div class="cmp flagged">${rows(c.missing)}</div>`:'<div class="none">None.</div>'}</section>
    </div>
    ${c.claimOnly.length?`<div class="panel aside">${c.claimOnly.length} claimed compound${c.claimOnly.length>1?'s do':' does'} not appear in the disclosure list. Not counted in the score.<div class="chips">${c.claimOnly.map(x=>`<code>${esc(x)}</code>`).join('')}</div></div>`:''}
    <div class="actions">
      <button class="btn btn-secondary" id="another">Check Another Patent</button>
      <button class="btn btn-primary" id="save">Save to Dashboard</button>
    </div>
    ${disclaimer()}
  </div>`;
}

/* ---------- Library ---------- */
function Library(){
  const q = libQuery.trim().toLowerCase();
  const list = sorted().filter(r => !q || r.name.toLowerCase().includes(q));
  const body = list.map(r=>{
    const c = compare(r.disclosed,r.claimed), n = splitName(r.name), open = openIds.has(r.id);
    const miss = new Set(c.missing.map(norm));
    return `<tr class="row ${open?'open':''}" data-toggle="${esc(r.id)}" tabindex="0" aria-expanded="${open}">
        <td style="width:30px;padding-right:0">${ICON.chev}</td>
        <td class="id">${esc(n.id)}</td>
        <td>${esc(n.title)}${demoTag(r)}</td>
        <td class="num">${r.disclosed.length}</td>
        <td class="num">${pctCell(c)}</td>
        <td>${status(c.missing.length)}</td>
        <td class="muted hide-sm">${esc(fmtDate(r.ts))}</td>
      </tr>
      ${open?`<tr class="detail"><td colspan="7">
        <div class="detail-grid">
          <div class="detail-col"><h3>Disclosed (${r.disclosed.length})</h3><ol>${r.disclosed.map(x=>`<li class="${miss.has(norm(x))?'flag':''}">${esc(x)}</li>`).join('')}</ol></div>
          <div class="detail-col"><h3>Claimed (${r.claimed.length})</h3><ol>${r.claimed.map(x=>`<li>${esc(x)}</li>`).join('') || '<li class="muted">None</li>'}</ol></div>
          <div class="detail-col"><h3>Flagged missing (${c.missing.length})</h3>${c.missing.length?`<ol>${c.missing.map(x=>`<li style="color:var(--bad)">${esc(x)}</li>`).join('')}</ol>`:'<p class="muted" style="margin:0;font-size:12px">None</p>'}</div>
        </div>
        <div class="detail-foot"><span>Saved ${esc(fmtDate(r.ts))}, ${esc(fmtTime(r.ts))} · ${c.matched.length} of ${r.disclosed.length} claimed</span><span id="del-${esc(r.id)}"><button class="btn-text btn-danger" data-del="${esc(r.id)}">Delete review</button></span></div>
      </td></tr>`:''}`;
  }).join('');
  return `<div class="page">
    <div class="head"><div><h1>Review Library</h1><p class="sub">All saved reviews. Select a row to see the full compound lists.</p></div>
      <button class="btn btn-primary" data-go="new">${ICON.plus}New Review</button></div>
    <section class="panel">
      <div class="toolbar">
        <label class="search">${ICON.search}<input type="search" id="q" placeholder="Filter by patent name or ID" value="${esc(libQuery)}" aria-label="Filter by patent name or ID"></label>
        <span class="muted" style="font-size:12px">${list.length} of ${reviews.length} review${reviews.length===1?'':'s'}</span>
      </div>
      ${list.length ? `<div class="table-wrap"><table>
        <thead><tr><th></th><th>Patent ID</th><th>Title</th><th class="num">Compounds</th><th class="num">Completeness</th><th>Status</th><th class="hide-sm">Reviewed</th></tr></thead>
        <tbody>${body}</tbody></table></div>`
      : reviews.length
        ? `<div class="empty"><h2>No matching reviews</h2><p>Nothing matches “${esc(libQuery)}”. Try part of the patent name or ID.</p></div>`
        : `<div class="empty"><h2>No saved reviews</h2><p>Reviews you save from the result screen appear here.</p></div>`}
    </section>
  </div>`;
}

/* ---------- Events ---------- */
function bind(){
  $main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $main.querySelectorAll('tr[data-open]').forEach(tr => {
    const f = () => { openIds = new Set([tr.dataset.open]); libQuery=''; go('library'); };
    tr.onclick = f; tr.onkeydown = e => { if(e.key==='Enter') f(); };
  });

  if(view==='new'){
    const pn = document.getElementById('pname'), d = document.getElementById('disc'), cl = document.getElementById('claim');
    pn.oninput = () => draft.name = pn.value;
    d.oninput = () => { draft.disclosed = d.value; document.getElementById('dc').textContent = parseList(d.value).length + ' unique'; };
    cl.oninput = () => { draft.claimed = cl.value; document.getElementById('cc').textContent = parseList(cl.value).length + ' unique'; };
    document.getElementById('sample').onclick = () => {
      draft = { name:'DX-2044 — Chelating Agents',
        disclosed:['Compound-A114','Compound-A120','Compound-B22','Compound-B27','Compound-M5','Compound-M6'].join('\n'),
        claimed:['compound-a114','Compound-A120 ','Compound-B22','Compound-B27','Compound-M5'].join('\n') };
      render();
    };
    document.getElementById('form').onsubmit = e => {
      e.preventDefault();
      const name = pn.value.trim(), dl = parseList(d.value), clst = parseList(cl.value), err = document.getElementById('err');
      if(!name){ err.textContent = 'Enter a patent name or ID.'; pn.focus(); return; }
      if(!dl.length){ err.textContent = 'Enter at least one disclosed compound.'; d.focus(); return; }
      current = { name, disclosed: dl, claimed: clst };
      go('result');
    };
  }

  if(view==='result'){
    document.getElementById('save').onclick = () => {
      reviews.push({ id:'r-'+Date.now().toString(36), name:current.name, disclosed:current.disclosed, claimed:current.claimed, ts:Date.now() });
      persist(); current = null; draft = {name:'',disclosed:'',claimed:''};
      go('dashboard'); toast('Review saved');
    };
    document.getElementById('another').onclick = () => { current = null; draft = {name:'',disclosed:'',claimed:''}; go('new'); };
  }

  if(view==='library'){
    const q = document.getElementById('q');
    q.oninput = () => { libQuery = q.value; const pos = q.selectionStart; render(); const nq = document.getElementById('q'); nq.focus(); nq.setSelectionRange(pos,pos); };
    $main.querySelectorAll('[data-toggle]').forEach(tr => {
      const f = () => { const id = tr.dataset.toggle; openIds.has(id) ? openIds.delete(id) : openIds.add(id); render(); };
      tr.onclick = f; tr.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); f(); } };
    });
    $main.querySelectorAll('[data-del]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const id = b.dataset.del, slot = document.getElementById('del-'+id);
      slot.innerHTML = `Delete this review? <button class="btn-text btn-danger" data-yes>Delete</button> · <button class="btn-text" data-no>Cancel</button>`;
      slot.querySelector('[data-yes]').onclick = () => { reviews = reviews.filter(r=>r.id!==id); persist(); render(); toast('Review deleted'); };
      slot.querySelector('[data-no]').onclick = () => render();
    });
  }
}

document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { if(b.dataset.nav==='new') current = null; go(b.dataset.nav); });
go('dashboard');
})();
</script>
</body>
</html>
