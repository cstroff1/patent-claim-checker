<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patent Claim Completeness Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7FAFC;
  --surface:#ffffff;
  --tint:#EAF4FB;
  --accent:#2E86C1;
  --accent-hover:#2573A8;
  --accent-ink:#1F6699;
  --ink:#1A2733;
  --ink-2:#51616F;
  --ink-3:#8394A3;
  --line:#E1E8EE;
  --line-2:#EEF2F5;
  --shadow:0 1px 2px rgba(16,40,64,.06),0 1px 3px rgba(16,40,64,.04);
  --ok:#1D7F4E;
  --ok-bg:#E8F5EE;
  --bad:#B42318;
  --bad-bg:#FDECEA;
  --warn-bg:#FFF8EB;
  --warn-line:#E8A33D;
  --warn-ink:#7A4B00;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1720;--surface:#141F2A;--tint:#16293A;--accent:#4A9FD8;--accent-hover:#63AFE2;--accent-ink:#86C1EA;
    --ink:#E3EAF0;--ink-2:#A3B2BF;--ink-3:#71849A;--line:#223242;--line-2:#1B2936;
    --shadow:0 1px 2px rgba(0,0,0,.35);
    --ok:#55C28A;--ok-bg:#132E23;--bad:#F08A7E;--bad-bg:#361C1D;--warn-bg:#2E2413;--warn-line:#C98A2E;--warn-ink:#F0C57A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1720;--surface:#141F2A;--tint:#16293A;--accent:#4A9FD8;--accent-hover:#63AFE2;--accent-ink:#86C1EA;
  --ink:#E3EAF0;--ink-2:#A3B2BF;--ink-3:#71849A;--line:#223242;--line-2:#1B2936;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --ok:#55C28A;--ok-bg:#132E23;--bad:#F08A7E;--bad-bg:#361C1D;--warn-bg:#2E2413;--warn-line:#C98A2E;--warn-ink:#F0C57A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Shell */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand-mark{width:22px;height:22px;border-radius:4px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.02em}
.brand-name{font-weight:600;font-size:13px;letter-spacing:-.005em}
.nav{display:flex;flex-direction:column;padding:12px 8px;gap:1px}
.nav-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:6px 10px 6px}
.nav button{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--ink-2);padding:7px 10px;border-radius:4px;text-align:left;font-weight:500;font-size:13px}
.nav button:hover{background:var(--line-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--tint);color:var(--accent-ink);font-weight:600}
.nav svg{width:15px;height:15px;flex:none;opacity:.85}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 16px;font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px}
.side-foot b{font-weight:600;color:var(--ink-2)}

.top{height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(16px,3vw,32px);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:500}
.env{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);padding:2px 7px;border-radius:3px;white-space:nowrap}

main{min-width:0;display:flex;flex-direction:column}
.page{max-width:1180px;width:100%;margin-inline:auto;padding-block:24px 32px;padding-inline:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:20px;flex:1}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-size:13px;font-weight:600;margin:0}
.sub{color:var(--ink-3);margin:3px 0 0;font-size:12.5px}
.mono{font-family:var(--mono);font-size:12px}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:4px;height:32px;padding:0 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.btn-secondary:hover{border-color:var(--ink-3)}
.btn-text{border:0;background:none;color:var(--accent-ink);font-weight:500;padding:0;font-size:12.5px}
.btn-text:hover{text-decoration:underline}
.btn-danger{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line);gap:12px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi-label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.kpi-val{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-val small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:2px}
.kpi-foot{font-size:11.5px;color:var(--ink-3)}
.kpi-val.bad{color:var(--bad)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 16px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
tr:last-child > td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover > td{background:var(--bg)}
.num{text-align:right}
.id{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.muted{color:var(--ink-3)}
.pct{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.bar{width:64px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.gap i{background:var(--bad)}
.status{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;letter-spacing:.01em}
.status.ok{color:var(--ok);background:var(--ok-bg)}
.status.bad{color:var(--bad);background:var(--bad-bg)}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);padding:0 4px;border-radius:3px;margin-left:6px;vertical-align:1px}

.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty p{color:var(--ink-3);max-width:46ch;margin:0}

/* Form */
.form{padding:20px;display:flex;flex-direction:column;gap:18px}
.field label{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;font-size:12.5px;margin-bottom:6px;gap:8px}
.field label span{font-weight:400;color:var(--ink-3);font-size:11.5px}
input[type=text],input[type=search],textarea{width:100%;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;padding:7px 10px;transition:border-color .12s,box-shadow .12s}
input[type=text],input[type=search]{height:34px;max-width:520px}
input:hover,textarea:hover{border-color:var(--ink-3)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.75;min-height:300px;resize:vertical;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ta-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 6px 6px}
.err{color:var(--bad);font-size:12.5px}

/* Result */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--warn-line);border-left-width:3px;border-radius:4px;background:var(--warn-bg);color:var(--warn-ink);font-weight:500}
.alert.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.alert svg{flex:none;margin-top:1px}
.summary{display:grid;grid-template-columns:minmax(220px,1.2fr) repeat(3,1fr)}
.summary > div{padding:16px 18px}
.summary > div + div{border-left:1px solid var(--line)}
.score-val{font-size:34px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.score-val.bad{color:var(--bad)}.score-val.ok{color:var(--ok)}
.score-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.score-bar i{display:block;height:100%}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.list-head{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-bottom:1px solid var(--line)}
.list-head .dot{width:8px;height:8px;border-radius:2px;flex:none}
.list-head .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cmp{max-height:380px;overflow-y:auto}
.cmp td{padding:7px 16px;font-family:var(--mono);font-size:12.5px}
.cmp td.ix{width:44px;color:var(--ink-3);font-size:11px;text-align:right;padding-right:0}
.cmp.flagged td:not(.ix){color:var(--bad);font-weight:500}
.cmp.flagged tr > td{background:color-mix(in srgb,var(--bad-bg) 55%,transparent)}
.none{padding:18px 16px;color:var(--ink-3);font-size:12.5px}
.aside{padding:12px 16px;font-size:12.5px;color:var(--ink-2)}
.aside .chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.aside code{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:3px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.cmp .ctx{display:block;font-family:var(--sans);font-size:11.5px;font-weight:400;color:var(--ink-2);margin-top:3px;white-space:normal;line-height:1.45}
.cmp .ctx mark{background:none;color:var(--bad);font-weight:600}
.cmp.flagged td{white-space:normal;vertical-align:top}

/* Source documents */
.sources{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.src{display:flex;flex-direction:column;transition:border-color .12s,box-shadow .12s}
.src.drag{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.src-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.src-head p{margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.src-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.src textarea{min-height:220px;font-family:var(--sans);font-size:12.5px;line-height:1.6}
.file-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.file-row b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .btn-text{margin-left:auto}
.file-err{font-size:12px;color:var(--bad)}
.det{border-top:1px solid var(--line);padding:12px 16px 14px;background:var(--bg);border-radius:0 0 6px 6px;display:flex;flex-direction:column;gap:8px}
.det-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.det-head h3{font-size:12px;font-weight:600;margin:0}
.det-head span{font-size:11.5px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:2px 3px 2px 7px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.added{border-color:var(--accent);color:var(--accent-ink)}
.chip button{border:0;background:none;padding:0 3px;color:var(--ink-3);font-size:13px;line-height:1}
.chip button:hover{color:var(--bad)}
.det-empty{font-size:12px;color:var(--ink-3)}
.add-row{display:flex;gap:6px}
.add-row input{height:28px;font-size:12px;max-width:none}
.add-row .btn{height:28px;font-size:12px}
.form-top{padding:16px 20px}
@media (max-width:760px){.sources{grid-template-columns:1fr}}

/* Library */
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:30px;height:32px}
.chev{transition:transform .15s;color:var(--ink-3);vertical-align:middle}
tr.open .chev{transform:rotate(90deg)}
tr.open > td{background:var(--bg)}
tr.detail > td{padding:0;background:var(--bg);white-space:normal}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line-2)}
.detail-col{padding:14px 16px 16px 46px}
.detail-col + .detail-col{border-left:1px solid var(--line-2);padding-left:16px}
.detail-col h3{font-size:11px;font-weight:600;color:var(--ink-3);margin:0 0 8px}
.detail-col ol{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;gap:3px}
.detail-col li.flag{color:var(--bad);font-weight:500}
.detail-col li.flag::after{content:"  not claimed";font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--bad)}
.detail-foot{display:flex;justify-content:space-between;gap:12px;padding:10px 16px 12px 46px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3);flex-wrap:wrap}

.disclaimer{margin-top:auto;padding-top:16px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:4px;font-weight:500;font-size:12.5px;box-shadow:0 4px 12px rgba(0,0,0,.18);transform:translate(-50%,8px);opacity:0;transition:.18s;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:1000px){.kpis,.summary{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3),.summary>div:nth-child(3){border-left:0}.kpi:nth-child(n+3),.summary>div:nth-child(n+3){border-top:1px solid var(--line)}.detail-grid{grid-template-columns:1fr}.detail-col,.detail-col+.detail-col{padding-left:16px;border-left:0}.detail-foot{padding-left:16px}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{border-bottom:0;padding-right:4px}
  .brand-name,.side-foot,.nav-label{display:none}
  .nav{flex-direction:row;padding:8px}
  .nav button{white-space:nowrap}
  .top{top:0}
  .two,.lists{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (max-width:460px){.kpis,.summary{grid-template-columns:1fr}.kpi+.kpi,.summary>div+div{border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark" aria-hidden="true">CC</div><div class="brand-name">Claim Completeness</div></div>
    <nav class="nav" aria-label="Main">
      <div class="nav-label">Reviews</div>
      <button data-nav="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</button>
      <button data-nav="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New Review</button>
      <button data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Review Library</button>
    </nav>
    <div class="side-foot"><b>Demo workspace</b><span>Local storage only</span></div>
  </aside>
  <main>
    <header class="top"><div class="crumbs" id="crumbs"></div><span class="env">Demo data</span></header>
    <div id="main" style="display:flex;flex-direction:column;flex:1"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const KEY = 'pccc.reviews.v2';
const DISCLAIMER = 'This tool works with compound names you provide directly — no connection to real patent filings or proprietary data.';
const LIB = {
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  mammoth:'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'
};

/* ---------- Sample documents (fictional) ---------- */
const SEED_BRIEF = `INVENTION DISCLOSURE (fictional sample)
Project DX-2031: Heterocyclic Kinase Inhibitors

Summary of results
The team prepared a series of pyrazolopyrimidine inhibitors. Compound-A114, Compound-A115 and Compound-A118 inhibited the target kinase below 50 nM. Compound-B22 showed the best oral exposure in rat. Compound-B23, the N-ethyl analogue of Compound-B22, kept its potency and improved solubility threefold.

Compound-C07 and Compound-C09 were prepared as prodrug forms. Compound-D301 is the crystalline salt selected for scale-up.`;
const SEED_CLAIMS = `CLAIMS
1. A compound selected from the group consisting of Compound-A114, Compound-A115, Compound-A118, Compound-B22, Compound-C07 and Compound-C09, or a pharmaceutically acceptable salt thereof.
2. The compound of claim 1, wherein the salt is Compound-D301.
3. A pharmaceutical composition comprising the compound of claim 1 and a pharmaceutically acceptable carrier.`;
const SAMPLE = {
  name:'DX-2044 — Chelating Agents',
  brief:`INVENTION DISCLOSURE (fictional sample)
Project DX-2044: Chelating Agents for Industrial Water Treatment

Summary
The research team synthesized six candidate chelators. Compound-A114 and Compound-A120 showed the strongest calcium binding at pH 7.4. Compound-B22 and Compound-B27 stayed stable above 90 °C.

Compound-M5 served as the reference agent. Compound-M6, a fluorinated analogue of Compound-M5, gave a 40% improvement in scale inhibition and is the lead candidate for the next round of testing.`,
  claims:`CLAIMS
1. A water-treatment composition comprising a chelating agent selected from the group consisting of Compound-A114, Compound-A120, Compound-B22 and Compound-B27.
2. The composition of claim 1, further comprising Compound M5.
3. The composition of claim 1, wherein the chelating agent is present at 0.5 to 5 wt%.`
};

/* ---------- Matching ---------- */
const DASH = '\\-\u2010-\u2015\u2212';
// Comparison key: case, spaces and hyphens are ignored, so "Compound M5" = "compound-m5".
const key = s => s.toLowerCase().replace(new RegExp('[\\s_'+DASH+']+','g'),'');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function nameRegex(n){
  const parts = n.trim().split(new RegExp('[\\s'+DASH+']+')).filter(Boolean).map(escRe);
  return new RegExp('(?<![A-Za-z0-9])'+parts.join('[\\s'+DASH+']*')+'(?![A-Za-z0-9])','i');
}
const foundIn = (name, text) => !!text && nameRegex(name).test(text);
function uniq(arr){ const seen = new Set(); return arr.filter(x => { const k = key(x); if(!k || seen.has(k)) return false; seen.add(k); return true; }); }
const clean = s => s.replace(/\s+/g,' ').trim();

const PATTERNS = [
  /\b(?:compound|cpd\.?)[\s\-\u2010-\u2015]*(?:no\.?\s*)?[A-Za-z]{0,4}[\-\u2010-\u2015]?\d{1,5}[A-Za-z]?\b/gi,  // Compound-A114, Compound 12
  /\b[A-Z]{2,6}[\-\u2010-\u2015]\d{2,7}[A-Z]?\b/g,                                                              // development codes, e.g. ABT-199
  /\b\d{2,7}-\d{2}-\d\b/g                                                                                       // CAS numbers
];
const CHEM_END = /(?:ine|ide|ol|one|ate|ane|ene|yne|ile|ium|azole|amine)$/i;

// Returns compound names found in free text, in order of first appearance.
// A short one-per-line list is taken line by line instead.
function extract(text, excludeId){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const short = l => l.split(/\s+/).length <= 5 && l.length <= 80 && !/[.;:]$/.test(l);
  const listy = lines.length >= 2 ? lines.filter(short).length / lines.length >= 0.8 : lines[0].split(/\s+/).length <= 3;
  if(listy) return uniq(lines.map(l => clean(l.replace(/^(?:[•*\-\u2013]\s+|\d{1,3}[.)]\s+)/,''))));

  const hits = [];
  PATTERNS.forEach(re => { re.lastIndex = 0; let m; while((m = re.exec(text))) hits.push({ s:m.index, e:m.index+m[0].length, v:clean(m[0]) }); });
  // Systematic names: hyphenated tokens with a chemical ending and a locant, bracket or "yl".
  const tokRe = /\S+/g; let t;
  while((t = tokRe.exec(text))){
    let v = t[0].replace(/[.,;:]+$/,'');
    while(v.endsWith(')') && (v.match(/\(/g)||[]).length < (v.match(/\)/g)||[]).length) v = v.slice(0,-1);
    if(v.length >= 10 && v.includes('-') && CHEM_END.test(v) && /\d|\(|\[|yl/.test(v)) hits.push({ s:t.index, e:t.index+v.length, v });
  }
  hits.sort((a,b) => a.s - b.s || (b.e-b.s) - (a.e-a.s));
  const out = []; let end = -1;
  hits.forEach(h => { if(h.s >= end){ out.push(h.v); end = h.e; } });
  const ex = excludeId ? key(excludeId) : null;
  return uniq(out.filter(v => key(v) !== ex));
}

function applyOv(list, ov){
  const rm = new Set((ov.removed||[]).map(key));
  return uniq(list.filter(x => !rm.has(key(x))).concat(ov.added||[]));
}
const patentId = name => { const m = name.match(/^(.*?)\s+[—–-]\s+/); return m ? m[1].trim() : ''; };
function disclosedOf(d){ return applyOv(extract(d.brief.text, patentId(d.name)), d.brief); }
function claimedOf(d, disclosed){
  const base = extract(d.claims.text, patentId(d.name)).concat(disclosed.filter(x => foundIn(x, d.claims.text)));
  return applyOv(base, d.claims);
}
function compare(disclosed, claimed){
  const c = new Set(claimed.map(key)), dk = new Set(disclosed.map(key));
  const matched = disclosed.filter(x => c.has(key(x)));
  const missing = disclosed.filter(x => !c.has(key(x)));
  const claimOnly = claimed.filter(x => !dk.has(key(x)));
  const pct = disclosed.length ? Math.round(matched.length / disclosed.length * 1000)/10 : 0;
  return { matched, missing, claimOnly, pct };
}
function context(name, text){
  if(!text) return null;
  const m = nameRegex(name).exec(text); if(!m) return null;
  const a = Math.max(0, m.index-80), b = Math.min(text.length, m.index+m[0].length+80);
  let pre = text.slice(a, m.index), post = text.slice(m.index+m[0].length, b);
  if(a > 0) pre = pre.replace(/^\S*\s/, '');
  if(b < text.length) post = post.replace(/\s\S*$/, '');
  return { pre:(a>0?'…':'')+clean(pre), hit:m[0], post:clean(post)+(b<text.length?'…':'') };
}

function load(){

}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(reviews)); return true; }

    // Storage full: keep the compound lists, drop the stored document text.
    try { localStorage.setItem(KEY, JSON.stringify(reviews.map(r => ({...r, briefText:undefined, claimsText:undefined})))); } catch(e2){}
    return false;
  }
}

/* ---------- File reading ---------- */
const scripts = {};
function loadScript(src){
  return scripts[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load the document reader. Check your connection, or paste the text instead.')); document.head.appendChild(s); });
}
async function readFile(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if(['txt','md','text','csv'].includes(ext)) return { text: await file.text() };
  if(ext === 'docx'){
    await loadScript(LIB.mammoth);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: r.value };
  }
  if(ext === 'pdf'){
    await loadScript(LIB.pdf);
    const pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    let out = '';
    for(let i = 1; i <= doc.numPages; i++){
      const tc = await (await doc.getPage(i)).getTextContent();
      out += tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n';
    }
    if(!out.trim()) throw new Error('This PDF has no selectable text. It may be a scanned image. Paste the text instead.');
    return { text: out, pages: doc.numPages };
  }
  if(ext === 'doc') throw new Error('Older .doc files are not supported. Save the file as .docx or PDF and upload it again.');
  throw new Error('Upload a PDF, Word (.docx) or plain-text file.');
}

  const withGaps = reviews.filter(r=>compare(r.disclosed,r.claimed).missing.length).length;
  const rows = sorted().slice(0,10).map(r=>{
    const c = compare(r.disclosed,r.claimed), n = splitName(r.name);

      <td>${status(c.missing.length)}</td>
      <td class="muted hide-sm">${esc(fmtDate(r.ts))} <span class="muted">${esc(fmtTime(r.ts))}</span></td></tr>`;

  return `<div class="page">

      <button class="btn btn-primary" data-go="new">${ICON.plus}New Review</button>

      <div class="kpi"><span class="kpi-label">Total Compounds Checked</span><span class="kpi-val">${total}</span><span class="kpi-foot">Disclosed compounds compared</span></div>
      <div class="kpi"><span class="kpi-label">Compounds Flagged Missing</span><span class="kpi-val ${flagged?'bad':''}">${flagged}</span><span class="kpi-foot">Disclosed, not in claims</span></div>
      <div class="kpi"><span class="kpi-label">Completeness Rate</span><span class="kpi-val">${rate===null?'—':rate}<small>${rate===null?'':'%'}</small></span><span class="kpi-foot">Claimed ÷ disclosed</span></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Recent reviews</h2>${reviews.length?'<button class="btn-text" data-go="library">View library</button>':''}</div>
      ${reviews.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Patent ID</th><th>Title</th><th class="num">Compounds</th><th class="num">Flagged</th><th class="num">Completeness</th><th>Status</th><th class="hide-sm">Reviewed</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
      : `<div class="empty"><h2>No reviews yet</h2><p>Compare a scientific brief against a claims section to start building review history.</p><button class="btn btn-primary" data-go="new" style="margin-top:8px">${ICON.plus}New Review</button></div>`}
    </section>
  </div>`;
}

function fileRow(side){

function Library(){
  const q = libQuery.trim().toLowerCase();
  const list = sorted().filter(r => !q || r.name.toLowerCase().includes(q));
  const body = list.map(r=>{
    const c = compare(r.disclosed,r.claimed), n = splitName(r.name), open = openIds.has(r.id);
    const miss = new Set(c.missing.map(key));
    const files = [r.briefFile, r.claimsFile].filter(Boolean).map(esc).join(', ');
    return `<tr class="row ${open?'open':''}" data-toggle="${esc(r.id)}" tabindex="0" aria-expanded="${open}">
        <td style="width:30px;padding-right:0">${ICON.chev}</td>
        <td class="id">${esc(n.id)}</td>
        <td>${esc(n.title)}${demoTag(r)}</td>
        <td class="num">${r.disclosed.length}</td>
        <td class="num">${pctCell(c)}</td>
        <td>${status(c.missing.length)}</td>
        <td class="muted hide-sm">${esc(fmtDate(r.ts))}</td>
      </tr>
      ${open?`<tr class="detail"><td colspan="7">
        <div class="detail-grid">
          <div class="detail-col"><h3>Disclosed (${r.disclosed.length})</h3><ol>${r.disclosed.map(x=>`<li class="${miss.has(key(x))?'flag':''}">${esc(x)}</li>`).join('')}</ol></div>
          <div class="detail-col"><h3>Claimed (${r.claimed.length})</h3><ol>${r.claimed.map(x=>`<li>${esc(x)}</li>`).join('') || '<li class="muted">None</li>'}</ol></div>
          <div class="detail-col"><h3>Flagged missing (${c.missing.length})</h3>${c.missing.length?`<ol>${c.missing.map(x=>`<li style="color:var(--bad)">${esc(x)}</li>`).join('')}</ol>`:'<p class="muted" style="margin:0;font-size:12px">None</p>'}</div>
        </div>
        <div class="detail-foot"><span>Saved ${esc(fmtDate(r.ts))}, ${esc(fmtTime(r.ts))}${r.edited?` · Edited ${esc(fmtDate(r.edited))}, ${esc(fmtTime(r.edited))}`:''} · ${c.matched.length} of ${r.disclosed.length} claimed${files?' · '+files:''}</span>
          <span id="del-${esc(r.id)}" style="display:flex;gap:16px"><button class="btn-text" data-edit="${esc(r.id)}">Edit review</button><button class="btn-text btn-danger" data-del="${esc(r.id)}">Delete</button></span></div>
      </td></tr>`:''}`;
  }).join('');
  return `<div class="page">
    <div class="head"><div><h1>Review Library</h1><p class="sub">All saved reviews. Select a row to see the compound lists or edit the review.</p></div>
      <button class="btn btn-primary" data-go="new">${ICON.plus}New Review</button></div>
    <section class="panel">
      <div class="toolbar">
        <label class="search">${ICON.search}<input type="search" id="q" placeholder="Filter by patent name or ID" value="${esc(libQuery)}" aria-label="Filter by patent name or ID"></label>
        <span class="muted" style="font-size:12px">${list.length} of ${reviews.length} review${reviews.length===1?'':'s'}</span>
      </div>
      ${list.length ? `<div class="table-wrap"><table>
        <thead><tr><th></th><th>Patent ID</th><th>Title</th><th class="num">Compounds</th><th class="num">Completeness</th><th>Status</th><th class="hide-sm">Reviewed</th></tr></thead>
        <tbody>${body}</tbody></table></div>`
      : reviews.length
        ? `<div class="empty"><h2>No matching reviews</h2><p>Nothing matches “${esc(libQuery)}”. Try part of the patent name or ID.</p></div>`
        : `<div class="empty"><h2>No saved reviews</h2><p>Reviews you save from the result screen appear here.</p></div>`}
    </section>
  </div>`;
}

function startEdit(id){
  const r = reviews.find(x => x.id === id); if(!r) return;
  const side = (text, list, file, ov) => ({ text: text ?? list.join('\n'), file: file || null, added: ov?.added?.slice() || [], removed: ov?.removed?.slice() || [] });
  draft = { editingId:id, name:r.name,
    brief: side(r.briefText, r.disclosed, r.briefFile, r.briefOv),
    claims: side(r.claimsText, r.claimed, r.claimsFile, r.claimsOv) };
  // Lists saved without their documents keep any manual changes as the text itself.
  if(r.briefText == null){ draft.brief.added = []; draft.brief.removed = []; }
  if(r.claimsText == null){ draft.claims.added = []; draft.claims.removed = []; }
  current = null; go('new');
}

/* ---------- Events ---------- */
function bind(){
  $main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { if(b.dataset.go==='new'){ draft = blankDraft(); current = null; } go(b.dataset.go); });
  $main.querySelectorAll('tr[data-open]').forEach(tr => {
    const f = () => { openIds = new Set([tr.dataset.open]); libQuery=''; go('library'); };
    tr.onclick = f; tr.onkeydown = e => { if(e.key==='Enter') f(); };
  });
  const cancel = document.getElementById('cancel-edit');
  if(cancel) cancel.onclick = () => { const id = draft.editingId; draft = blankDraft(); current = null; openIds = new Set([id]); go('library'); };

  if(view==='new'){
    const pn = document.getElementById('pname');
    let t;
    pn.oninput = () => { draft.name = pn.value; clearTimeout(t); t = setTimeout(refreshDetected, 250); };
    ['brief','claims'].forEach(side => {
      const ta = document.getElementById('text-'+side), fi = document.getElementById('file-'+side), panel = $main.querySelector(`.src[data-side="${side}"]`);
      ta.oninput = () => { draft[side].text = ta.value; clearTimeout(t); t = setTimeout(refreshDetected, 250); };
      const take = async file => {
        if(!file) return;
        const s = draft[side]; s.error = null; s.loading = file.name;
        document.getElementById(`file-${side}-row`).innerHTML = fileRow(side);
        try {
          const r = await readFile(file);
          Object.assign(s, { text: r.text.replace(/\n{3,}/g,'\n\n').trim(), file: file.name, pages: r.pages || null, added: [], removed: [], loading: null });
          ta.value = s.text;
        } catch(e){ s.loading = null; s.error = e.message || 'Could not read that file.'; }
        document.getElementById(`file-${side}-row`).innerHTML = fileRow(side);
        refreshDetected();
      };
      fi.onchange = () => { take(fi.files[0]); fi.value = ''; };
      panel.ondragover = e => { e.preventDefault(); panel.classList.add('drag'); };
      panel.ondragleave = e => { if(!panel.contains(e.relatedTarget)) panel.classList.remove('drag'); };
      panel.ondrop = e => { e.preventDefault(); panel.classList.remove('drag'); take(e.dataTransfer.files[0]); };
    });

    const form = document.getElementById('form');
    form.addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      const side = b.dataset.rm || b.dataset.add || b.dataset.restore || b.dataset.clear; if(!side) return;
      const s = draft[side];
      if(b.dataset.rm){
        const k = key(b.dataset.v);
        if(s.added.some(x => key(x) === k)) s.added = s.added.filter(x => key(x) !== k); else s.removed.push(b.dataset.v);
      } else if(b.dataset.add){
        const inp = document.getElementById('add-'+side), v = clean(inp.value); if(!v) return;
        s.removed = s.removed.filter(x => key(x) !== key(v));
        if(!s.added.some(x => key(x) === key(v))) s.added.push(v);
      } else if(b.dataset.restore){ s.removed = []; }
      else if(b.dataset.clear){ Object.assign(s, { file:null, pages:null, error:null }); document.getElementById(`file-${side}-row`).innerHTML = ''; }
      refreshDetected();
      if(b.dataset.add) document.getElementById('add-'+side).focus();
    });
    form.addEventListener('keydown', e => {
      if(e.key === 'Enter' && e.target.id && e.target.id.startsWith('add-')){ e.preventDefault(); form.querySelector(`[data-add="${e.target.id.slice(4)}"]`).click(); }
    });

    const sample = document.getElementById('sample');
    if(sample) sample.onclick = () => {
      draft = { editingId:null, name:SAMPLE.name,
        brief:{ ...blankSide(), text:SAMPLE.brief, file:'DX-2044_disclosure.pdf' },
        claims:{ ...blankSide(), text:SAMPLE.claims, file:'DX-2044_claims.docx' } };
      render();
    };
    form.onsubmit = e => {
      e.preventDefault();
      const name = pn.value.trim(), err = document.getElementById('err');
      const disclosed = disclosedOf(draft), claimed = claimedOf(draft, disclosed);
      if(!name){ err.textContent = 'Enter a patent name or ID.'; pn.focus(); return; }
      if(!draft.brief.text.trim() && !draft.brief.added.length){ err.textContent = 'Add the scientific brief.'; document.getElementById('text-brief').focus(); return; }
      if(!disclosed.length){ err.textContent = 'No compounds were detected in the brief. Add them under Disclosed compounds.'; document.getElementById('add-brief').focus(); return; }
      if(!draft.claims.text.trim() && !draft.claims.added.length){ err.textContent = 'Add the patent claims.'; document.getElementById('text-claims').focus(); return; }
      current = { name, disclosed, claimed, briefText:draft.brief.text, claimsText:draft.claims.text, briefFile:draft.brief.file, claimsFile:draft.claims.file };
      go('result');
    };
    refreshDetected();
  }

  if(view==='result'){
    document.getElementById('back-edit').onclick = () => { current = null; go('new'); };
    document.getElementById('save').onclick = () => {
      const rec = { name:current.name, disclosed:current.disclosed, claimed:current.claimed,
        briefText:draft.brief.text, claimsText:draft.claims.text, briefFile:draft.brief.file, claimsFile:draft.claims.file,
        briefOv:{ added:draft.brief.added, removed:draft.brief.removed }, claimsOv:{ added:draft.claims.added, removed:draft.claims.removed } };
      const editing = draft.editingId;
      if(editing){
        const i = reviews.findIndex(r => r.id === editing);
        if(i >= 0) reviews[i] = { ...reviews[i], ...rec, edited: Date.now() };
      } else reviews.push({ id:'r-'+Date.now().toString(36), ...rec, ts:Date.now() });
      const ok = persist();
      current = null; draft = blankDraft();
      if(editing){ openIds = new Set([editing]); go('library'); } else go('dashboard');
      toast(ok ? (editing ? 'Changes saved' : 'Review saved') : 'Saved. The documents were too large to keep, so only the compound lists were stored.');
    };
    const another = document.getElementById('another');
    if(another) another.onclick = () => { current = null; draft = blankDraft(); go('new'); };
  }

  if(view==='library'){
    const q = document.getElementById('q');
    q.oninput = () => { libQuery = q.value; const pos = q.selectionStart; render(); const nq = document.getElementById('q'); nq.focus(); nq.setSelectionRange(pos,pos); };
    $main.querySelectorAll('[data-toggle]').forEach(tr => {
      const f = () => { const id = tr.dataset.toggle; openIds.has(id) ? openIds.delete(id) : openIds.add(id); render(); };
      tr.onclick = f; tr.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); f(); } };
    });
    $main.querySelectorAll('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); startEdit(b.dataset.edit); });
    $main.querySelectorAll('[data-del]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const id = b.dataset.del, slot = document.getElementById('del-'+id);
      slot.innerHTML = `Delete this review? <button class="btn-text btn-danger" data-yes>Delete</button><button class="btn-text" data-no>Cancel</button>`;
      slot.querySelector('[data-yes]').onclick = () => { reviews = reviews.filter(r=>r.id!==id); persist(); render(); toast('Review deleted'); };
      slot.querySelector('[data-no]').onclick = () => render();
    });
  }
}

document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { if(b.dataset.nav==='new'){ current = null; draft = blankDraft(); } go(b.dataset.nav); });
go('dashboard');
})();
</script>
</body>
</html>
